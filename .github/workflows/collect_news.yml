name: Dubai News Collector

on:
  # Расписание - каждый час
  schedule:
    - cron: '0 * * * *'
  
  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:
    inputs:
      force_collect:
        description: 'Принудительный сбор всех источников'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dubai-news-storage
  cancel-in-progress: false

jobs:
  collect-news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Configure storage commits
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('src/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        cd src
        pip install -r requirements.txt
        
    - name: Create storage directory
      run: |
        mkdir -p storage/dubai_news
        
    - name: Run news collector
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SOURCE_VERIFIER: auto
        OPENAI_NEWS_SEARCH_ENABLED: ${{ vars.OPENAI_NEWS_SEARCH_ENABLED || 'true' }}
        OPENAI_MAX_SEARCHES_PER_DAY: ${{ vars.OPENAI_MAX_SEARCHES_PER_DAY || '2' }}
        OPENAI_MONTHLY_BUDGET_USD: ${{ vars.OPENAI_MONTHLY_BUDGET_USD || '3' }}
        OPENAI_MAX_CALLS_PER_DAY: ${{ vars.OPENAI_MAX_CALLS_PER_DAY || '8' }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        GNEWS_API_KEY_BACKUP: ${{ secrets.GNEWS_API_KEY_BACKUP }}
      run: |
        cd src
        python workflow_run.py rss_collect
        
    - name: Commit and push changes
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add storage/dubai_news/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update news data [skip ci]"
        git push
