name: Publish Dubai Then
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 6'
  push:
    branches: [main]
    paths: ['config/retro_first_post.json']
permissions:
  contents: write
concurrency:
  group: dubai-news-storage
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r src/requirements.txt
      - name: Configure storage commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Prepare, verify and publish weekly archive post
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_VERIFIER: openai
          OPENAI_MONTHLY_BUDGET_USD: '3'
          OPENAI_MAX_CALLS_PER_DAY: ${{ vars.OPENAI_MAX_CALLS_PER_DAY || '8' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python src/retro_publish.py
      - name: Persist verification cache and usage
        if: always()
        run: |
          git add storage/dubai_news/
          if ! git diff --cached --quiet; then
            git commit -m "Save retro publication data [skip ci]"
            git push origin HEAD:main
          fi
