name: Publish News to Telegram

on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        cd src
        pip install -r requirements.txt
        
    - name: Create storage directory
      run: |
        mkdir -p storage/dubai_news
        
    - name: Run auto-notify
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: |
        cd src
        python -c "from auto_notify import handler; import json; result = handler({}, None); print(json.dumps(json.loads(result['body']), indent=2))"
        
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add storage/dubai_news/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update published data [skip ci]"
        git push