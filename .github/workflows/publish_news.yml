name: Publish News to Telegram

on:
  # Расписание - каждый час, через 5 минут после сбора
  schedule:
    - cron: '5 * * * *'
  
  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Принудительная публикация'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dubai-news-storage
  cancel-in-progress: false

jobs:
  publish-news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Configure storage commits
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        cd src
        pip install -r requirements.txt
        
    - name: Create storage directory
      run: |
        mkdir -p storage/dubai_news
        
    - name: Run auto-notify
      env:
        SOURCE_VERIFIER: ${{ secrets.OPENAI_API_KEY != '' && 'openai' || 'deepseek' }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: |
        cd src
        python workflow_run.py auto_notify
        
    - name: Commit and push changes
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add storage/dubai_news/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update published data [skip ci]"
        git push
