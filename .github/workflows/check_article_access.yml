name: Check article access (no AI spend)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/search_sources.py'
      - '.github/workflows/check_article_access.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests==2.31.0
      - name: Read cached article URLs without calling AI
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, 'src')
          from search_sources import fetch_article
          cache = json.loads(Path('storage/dubai_news/openai_search_cache.json').read_text())
          latest = max(cache.values(), key=lambda entry: entry['saved_at'])
          for url in latest['urls']:
              diagnostics = []
              article = fetch_article(url, datetime.now(timezone.utc), diagnostics=diagnostics)
              print(json.dumps({'url': url, 'accepted': bool(article), 'diagnostics': diagnostics,
                                'text_length': len(article['description']) if article else 0}))
          PY
